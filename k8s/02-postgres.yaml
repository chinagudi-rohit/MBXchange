# In-cluster PostgreSQL for pilot/testing.
# For production on Azure, prefer managed Azure Database for PostgreSQL:
# skip this file and point DATABASE_URL (in the secret) at the managed server.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mbxchange
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mbxchange
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mbxchange
            - name: POSTGRES_USER
              value: mbx
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mbxchange-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mbx", "-d", "mbxchange"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # On AKS this defaults to Azure Disk (managed-csi). Adjust if needed:
        # storageClassName: managed-csi
        resources:
          requests:
            storage: 10Gi
