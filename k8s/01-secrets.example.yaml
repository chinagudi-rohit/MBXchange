# Copy to 01-secrets.yaml, replace every CHANGE_ME, then:
#   kubectl apply -f k8s/01-secrets.yaml
# NEVER commit the real 01-secrets.yaml (it is gitignored).
#
# For managed Azure Database for PostgreSQL, set DATABASE_URL to:
#   postgres://<user>:<password>@<server>.postgres.database.azure.com:5432/mbxchange?sslmode=require
# and also set PGSSL=require in 03-app.yaml env.
apiVersion: v1
kind: Secret
metadata:
  name: mbxchange-secrets
  namespace: mbxchange
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_long_random_string"
  POSTGRES_PASSWORD: "CHANGE_ME_strong_db_password"
  DATABASE_URL: "postgres://mbx:CHANGE_ME_strong_db_password@postgres:5432/mbxchange"
